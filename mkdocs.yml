site_name: FLUX 文档
site_url: https://su-cyber-art.github.io/FLUX/
site_description: Su-cyber-art 个人维护的流量转发面板
site_author: Su-cyber-art
repo_name: Su-cyber-art/FLUX
repo_url: https://github.com/Su-cyber-art/FLUX

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

docs_dir: doc

nav:
  - 首页: index.md
  - 开发指南: development.md
  - 源码部署: install.md
  - 使用指南: usage.md
  - AI Skill 接入: ai-skill.md
  - PostgreSQL: postgresql.md
  - 常见问题: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

name: Release FLUX
run-name: Release FLUX ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 3.1.0 (no v prefix)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flux-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      image_prefix: ${{ steps.release.outputs.image_prefix }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release identity
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess, urllib.error, urllib.request
          version = os.environ['REQUESTED_VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', version):
              raise SystemExit('Invalid numeric release version')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tag = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{version}^{{commit}}'], text=True, capture_output=True)
          if tag.returncode == 0 and tag.stdout.strip() != sha:
              raise SystemExit('Existing tag belongs to a different commit')
          request = urllib.request.Request(f'https://api.github.com/repos/{repo}/releases/tags/{version}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request) as response:
                  release = json.load(response)
              if not release['draft']:
                  raise SystemExit('Published releases are immutable; choose a new version')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nsha={sha}\nimage_prefix=ghcr.io/{repo.lower()}\nprerelease={str("-" in version).lower()}\n')
          PYCODE
      - name: Validate installer templates and release rendering
        run: |
          bash test-install-scripts-proxy.sh
          bash test-release-artifacts.sh
          bash test-docker-bootstrap.sh

  docker-bootstrap:
    name: Official Docker installation on clean Linux
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install and verify Docker using the generated panel script
        run: sudo env GITHUB_ACTIONS=true bash scripts/test-docker-bootstrap-linux.sh

  build:
    name: Build and smoke test ${{ matrix.arch }}
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      FLUX_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      FLUX_IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go-backend/go.sum
            go-gost/go.sum
            go-gost/x/go.sum
      - name: Backend tests
        working-directory: go-backend
        run: go test ./...
      - name: Build agent and check version
        working-directory: go-gost
        run: |
          mkdir -p ../artifacts
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -trimpath -ldflags="-s -w -X main.version=$FLUX_RELEASE_VERSION" -o ../artifacts/gost-${{ matrix.arch }} .
          ../artifacts/gost-${{ matrix.arch }} -V | grep -F "gost $FLUX_RELEASE_VERSION "
      - name: Agent unit and protocol tests
        run: |
          (cd go-gost && go test ./internal/retirement)
          (cd go-gost/x && go test ./socket ./config)
      - name: Verify real agent removal on systemd and OpenRC
        run: |
          (cd go-backend && CGO_ENABLED=0 go test -c -o ../artifacts/node-deletion.test ./internal/http/handler)
          sudo env FLUX_AGENT_INTEGRATION_BINARY="$PWD/artifacts/gost-${{ matrix.arch }}" artifacts/node-deletion.test -test.run '^TestAgentRemovalIntegration$' -test.v -test.timeout 90s
          docker run --rm -v "$PWD/artifacts:/artifacts:ro" -e FLUX_AGENT_INTEGRATION_BINARY=/artifacts/gost-${{ matrix.arch }} -e FLUX_AGENT_SERVICE_MANAGER=openrc alpine:3.22 sh -ec '
            apk add --no-cache openrc ca-certificates
            mkdir -p /run/openrc
            touch /run/openrc/softlevel
            /artifacts/node-deletion.test -test.run "^TestAgentRemovalIntegration$" -test.v -test.timeout 90s
          '
          rm artifacts/node-deletion.test
      - uses: docker/setup-buildx-action@v3
      - name: Set frontend release metadata
        run: |
          printf 'VITE_APP_VERSION=%s\nVITE_GITHUB_REPO=https://github.com/%s\n' "$FLUX_RELEASE_VERSION" "$GITHUB_REPOSITORY" > vite-frontend/.env.production
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./go-backend
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.FLUX_IMAGE_PREFIX }}/backend:${{ env.FLUX_RELEASE_VERSION }}
          build-args: |
            KEYGEN_ACCOUNT_ID=${{ secrets.KEYGEN_ACCOUNT_ID }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ env.FLUX_RELEASE_VERSION }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./vite-frontend
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.FLUX_IMAGE_PREFIX }}/frontend:${{ env.FLUX_RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ env.FLUX_RELEASE_VERSION }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}
      - name: Smoke test actual images
        run: bash scripts/smoke-release-images.sh
      - name: Export self-contained image archives
        run: |
          docker save "$FLUX_IMAGE_PREFIX/backend:$FLUX_RELEASE_VERSION" | gzip > artifacts/flux-backend-linux-${{ matrix.arch }}.tar.gz
          docker save "$FLUX_IMAGE_PREFIX/frontend:$FLUX_RELEASE_VERSION" | gzip > artifacts/flux-frontend-linux-${{ matrix.arch }}.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture image tags
        run: |
          for component in backend frontend; do
            docker tag "$FLUX_IMAGE_PREFIX/$component:$FLUX_RELEASE_VERSION" "$FLUX_IMAGE_PREFIX/$component:$FLUX_RELEASE_VERSION-${{ matrix.arch }}"
            docker push "$FLUX_IMAGE_PREFIX/$component:$FLUX_RELEASE_VERSION-${{ matrix.arch }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: artifacts/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Verify and publish release
    needs: [prepare, docker-bootstrap, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      FLUX_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      FLUX_IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Render release installers and verify all checksums
        run: |
          python3 scripts/prepare-release.py --repository "$GITHUB_REPOSITORY" --version "$FLUX_RELEASE_VERSION" --output artifacts
          bash -n artifacts/install.sh artifacts/panel_install.sh
          (cd artifacts && sha256sum -c SHA256SUMS)
          docker run --rm -v "$PWD:/workspace:ro" alpine:3.22 sh /workspace/test-install-scripts-alpine.sh /workspace/artifacts/install.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        run: |
          for component in backend frontend; do
            docker buildx imagetools create -t "$FLUX_IMAGE_PREFIX/$component:$FLUX_RELEASE_VERSION" \
              "$FLUX_IMAGE_PREFIX/$component:$FLUX_RELEASE_VERSION-amd64" \
              "$FLUX_IMAGE_PREFIX/$component:$FLUX_RELEASE_VERSION-arm64"
          done
      - name: Prepare release notes
        run: python3 scripts/write-release-notes.py --repository "$GITHUB_REPOSITORY" --version "$FLUX_RELEASE_VERSION" --output "$RUNNER_TEMP/release-notes.md"
      - name: Upload assets to a draft
        run: |
          if gh release view "$FLUX_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$FLUX_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release upload "$FLUX_RELEASE_VERSION" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$FLUX_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            args=()
            if [[ "$IS_PRERELEASE" == true ]]; then args+=(--prerelease); fi
            gh release create "$FLUX_RELEASE_VERSION" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --draft --target "$RELEASE_SHA" --title "FLUX $FLUX_RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"
          fi
      - name: Verify uploaded asset sizes and digests
        run: |
          release_id=$(gh release view "$FLUX_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release.json"
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'release.json').read_text())
          assert release['draft']
          assets = {asset['name']: asset for asset in release['assets']}
          files = list(Path('artifacts').iterdir())
          assert set(assets) == {path.name for path in files}
          for path in files:
              asset = assets[path.name]
              assert asset['state'] == 'uploaded' and asset['size'] == path.stat().st_size > 0, path.name
              if asset.get('digest'):
                  digest = hashlib.sha256()
                  with path.open('rb') as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                          digest.update(chunk)
                  assert asset['digest'] == 'sha256:' + digest.hexdigest(), path.name
          PYCODE
      - name: Publish complete release
        run: |
          if [[ "$IS_PRERELEASE" == true ]]; then
            gh release edit "$FLUX_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$FLUX_RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            for component in backend frontend; do
              docker buildx imagetools create -t "$FLUX_IMAGE_PREFIX/$component:latest" "$FLUX_IMAGE_PREFIX/$component:$FLUX_RELEASE_VERSION"
            done
          fi
      - name: Check public installer downloads
        run: |
          mkdir -p "$RUNNER_TEMP/public-check"
          for file in panel_install.sh install.sh SHA256SUMS; do
            curl -fL --retry 5 --retry-delay 3 "https://github.com/$GITHUB_REPOSITORY/releases/download/$FLUX_RELEASE_VERSION/$file" -o "$RUNNER_TEMP/public-check/$file"
            cmp "artifacts/$file" "$RUNNER_TEMP/public-check/$file"
          done

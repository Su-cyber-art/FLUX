<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FLVX" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <title>FLVX</title>
    <script>
      (function () {
        var mode = 'system';
        try { mode = localStorage.getItem('flvx:theme') || 'system'; } catch (_) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        try {
          var icon = localStorage.getItem('vite_config_app_favicon');
          if (icon) { var link = document.createElement('link'); link.id = 'app-favicon'; link.rel = 'icon'; link.href = icon; document.head.appendChild(link); }
        } catch (_) {}
      })();
    </script>
    <style>
      html { background: #f5f7fa; }
      html[data-mantine-color-scheme="dark"] { background: #101927; }
      body { margin: 0; }
      #root { min-height: 100dvh; }
    </style>
    <meta key="title" content="FLVX" property="og:title" />
    <meta
      content="FLVX"
      property="og:description"
    />
    <meta
      content="FLVX"
      name="description"
    />
    <meta
      key="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
      name="viewport"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
